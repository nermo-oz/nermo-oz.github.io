---
layout: default
---
<article class="prose">
  <time class="hand">{{ page.date | date: "%b %-d, %Y" }}</time>
  <h1 style="font-size:clamp(2.2rem,5vw,3.2rem)">{{ page.title }}</h1>
  <div style="margin-top:1.6rem">{{ content }}</div>
  <p><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
</article>
