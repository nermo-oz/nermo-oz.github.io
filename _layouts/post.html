---
layout: default
---
<article class="prose">
  <time class="hand" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
  <h1 class="title sub">{{ page.title }}</h1>
  <div class="post-body">{{ content }}</div>
  <p><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
</article>
