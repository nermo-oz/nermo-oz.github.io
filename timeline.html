---
layout: default
title: Timeline
permalink: /timeline/
---
<section>
  <h1 class="title">Timeline</h1>
  <ol class="tl">
  {% assign tl = site.data.timeline | sort: "date" | reverse %}
  {% for t in tl %}<li><time datetime="{{ t.date }}">{{ t.when }}</time><h3>{{ t.title }}</h3><p>{{ t.note }}</p></li>{% endfor %}
  </ol>
</section>
